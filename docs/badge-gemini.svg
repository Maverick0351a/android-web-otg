<svg xmlns="http://www.w3.org/2000/svg" width="202" height="20" viewBox="0 0 202 20" role="img" aria-label="Forged by Gemini 4 Neon">
  <defs>
    <linearGradient id="obsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111a"/>
      <stop offset="52%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0e0b1a"/>
    </linearGradient>
    <linearGradient id="gemEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="48%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="gemEdgeGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="gemStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="52%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="gemWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="202" height="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <!-- Full Volcanic Obsidian Stone body -->
    <rect x="0" y="0" width="202" height="20" fill="url(#obsBody)"/>

    <!-- Subtle internal Gemini edge-bleed aura on right & bottom/top edges -->
    <rect x="0" y="0" width="202" height="20" fill="url(#gemEdgeGlow)"/>
    <rect x="2.2" y="2.2" width="197.6" height="15.6" fill="#06060b" fill-opacity="0.92"/>

    <!-- Obsidian diagonal specular facet -->
    <polygon points="0,0 98,0 74,20 0,20" fill="#ffffff" fill-opacity="0.032"/>

    <!-- Soft neon inner halo + sharp 1.4px Gemini neon edge stroke -->
    <rect x="0.8" y="0.8" width="200.4" height="18.4" fill="none" stroke="url(#gemEdge)" stroke-width="2.6" stroke-opacity="0.34"/>
    <rect x="0.7" y="0.7" width="200.6" height="18.6" fill="none" stroke="url(#gemEdge)" stroke-width="1.4"/>

    <!-- Crisp neon divider between Forged by & Gemini 4 Neon -->
    <line x1="87" y1="3" x2="87" y2="17" stroke="url(#gemEdge)" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- Signature dual Gemini 4-point sparkle -->
  <path d="M11,3.2 C11.35,6.8 13.7,9.15 17.3,9.5 C13.7,9.85 11.35,12.2 11,15.8 C10.65,12.2 8.3,9.85 4.7,9.5 C8.3,9.15 10.65,6.8 11,3.2 Z" fill="url(#gemStar)"/>
  <path d="M17.1,12.2 C17.28,13.65 18.05,14.42 19.5,14.6 C18.05,14.78 17.28,15.55 17.1,17 C16.92,15.55 16.15,14.78 14.7,14.6 C16.15,14.42 16.92,13.65 17.1,12.2 Z" fill="#00E5FF" fill-opacity="0.92"/>

  <g text-anchor="middle" font-family="'Google Sans','Product Sans','Avenir Next','Century Gothic','Segoe UI',system-ui,sans-serif" text-rendering="geometricPrecision">
    <text x="53" y="14.5" font-size="10.6" font-weight="500" letter-spacing="0.3" fill="#000000" fill-opacity="0.55">Forged by</text>
    <text x="53" y="13.8" font-size="10.6" font-weight="500" letter-spacing="0.3" fill="#d4d4d8">Forged by</text>
    <text x="144.5" y="14.6" font-size="11.2" font-weight="700" letter-spacing="0.4" fill="#000000" fill-opacity="0.6">Gemini 4 Neon</text>
    <text x="144.5" y="13.9" font-size="11.2" font-weight="700" letter-spacing="0.4" fill="url(#gemWordGrad)">Gemini 4 Neon</text>
  </g>
</svg>
