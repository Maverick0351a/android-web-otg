name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            os: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            os: windows
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            os: macos
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: true
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 cross linker
        if: ${{ matrix.cross && matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Run tests (Unix host architecture)
        if: ${{ !matrix.cross && matrix.os != 'windows' }}
        run: cargo test --locked
      - name: Run tests (Windows host architecture)
        if: ${{ matrix.os == 'windows' }}
        run: cargo test --lib --tests --locked
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix tarball & checksums
        if: ${{ matrix.os != 'windows' }}
        run: |
          mkdir -p dist dist/skills/android-web-otg
          cp "target/${{ matrix.target }}/release/android-web-otg" dist/
          cp LICENSE README.md dist/
          cp skills/android-web-otg/SKILL.md dist/skills/android-web-otg/
          if [ "${{ matrix.os }}" = "linux" ]; then
            mkdir -p dist/deploy
            cp deploy/51-android.rules deploy/android-web-otg.service dist/deploy/
          fi
          archive="android-web-otg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$archive" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 "$archive" > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
      - name: Package Windows zip & checksums
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist/skills/android-web-otg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/android-web-otg.exe" dist/
          Copy-Item LICENSE, README.md dist/
          Copy-Item skills/android-web-otg/SKILL.md dist/skills/android-web-otg/
          $archive = "android-web-otg-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Set-Content -Encoding ascii "SHA256SUMS-${{ matrix.target }}.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-web-otg-*.tar.gz
            android-web-otg-*.zip
            SHA256SUMS-*.txt

  publish-crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (or dry-run if CARGO_REGISTRY_TOKEN unset)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            cargo publish --locked
          else
            echo "::notice::CARGO_REGISTRY_TOKEN not configured; running cargo publish --dry-run --locked."
            cargo publish --dry-run --locked
          fi

  wheels:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: auto
          - runner: macos-latest
            target: x86_64-apple-darwin
            manylinux: auto
          - runner: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ runner.os != 'Linux' }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/android-web-otg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
