[package]
name = "android-web-otg"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Android AOAv2 USB OTG mouse/keyboard rescue bridge with optional live screen mirroring, hardware specs, telemetry, and stdio MCP server"
license = "MIT"
homepage = "https://github.com/Maverick0351a/android-web-otg"
repository = "https://github.com/Maverick0351a/android-web-otg"
readme = "README.md"
exclude = ["docs/*.gif", "docs/*.png", ".github/", "GEMINI.md"]
keywords = ["android", "aoav2", "usb-otg", "hid", "mcp"]
categories = ["command-line-utilities", "hardware-support", "web-programming::http-server"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
nusb = { version = "0.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
