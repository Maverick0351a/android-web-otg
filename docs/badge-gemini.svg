<svg xmlns="http://www.w3.org/2000/svg" width="164" height="18" viewBox="0 0 164 18" role="img" aria-label="Forged by Gemini 4 Neon">
  <defs>
    <linearGradient id="obsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111a"/>
      <stop offset="52%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0e0b1a"/>
    </linearGradient>
    <linearGradient id="gemEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="48%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="gemEdgeGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="gemStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="52%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="gemWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="164" height="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <!-- Full Volcanic Obsidian Stone body -->
    <rect x="0" y="0" width="164" height="18" fill="url(#obsBody)"/>

    <!-- Subtle internal Gemini edge-bleed aura -->
    <rect x="0" y="0" width="164" height="18" fill="url(#gemEdgeGlow)"/>
    <rect x="1.8" y="1.8" width="160.4" height="14.4" fill="#06060b" fill-opacity="0.93"/>

    <!-- Obsidian diagonal specular facet -->
    <polygon points="0,0 82,0 60,18 0,18" fill="#ffffff" fill-opacity="0.032"/>

    <!-- Soft neon inner halo + sharp 1.25px Gemini neon edge stroke -->
    <rect x="0.7" y="0.7" width="162.6" height="16.6" fill="none" stroke="url(#gemEdge)" stroke-width="2.2" stroke-opacity="0.34"/>
    <rect x="0.6" y="0.6" width="162.8" height="16.8" fill="none" stroke="url(#gemEdge)" stroke-width="1.25"/>

    <!-- Crisp neon divider -->
    <line x1="69" y1="2.8" x2="69" y2="15.2" stroke="url(#gemEdge)" stroke-opacity="0.6" stroke-width="0.9"/>
  </g>

  <!-- Signature dual Gemini 4-point sparkle -->
  <path d="M9.5,3 C9.8,6.1 11.9,8.2 15,8.5 C11.9,8.8 9.8,10.9 9.5,14 C9.2,10.9 7.1,8.8 4,8.5 C7.1,8.2 9.2,6.1 9.5,3 Z" fill="url(#gemStar)"/>
  <path d="M14.8,10.9 C14.95,12.1 15.6,12.75 16.8,12.9 C15.6,13.05 14.95,13.7 14.8,14.9 C14.65,13.7 14,13.05 12.8,12.9 C14,12.75 14.65,12.1 14.8,10.9 Z" fill="#00E5FF" fill-opacity="0.92"/>

  <g text-anchor="middle" font-family="'Google Sans','Product Sans','Avenir Next','Century Gothic','Segoe UI',system-ui,sans-serif" text-rendering="geometricPrecision">
    <text x="43.5" y="13" font-size="9.4" font-weight="500" letter-spacing="0.2" fill="#000000" fill-opacity="0.55">Forged by</text>
    <text x="43.5" y="12.3" font-size="9.4" font-weight="500" letter-spacing="0.2" fill="#d4d4d8">Forged by</text>
    <text x="116.5" y="13.1" font-size="9.8" font-weight="700" letter-spacing="0.3" fill="#000000" fill-opacity="0.6">Gemini 4 Neon</text>
    <text x="116.5" y="12.4" font-size="9.8" font-weight="700" letter-spacing="0.3" fill="url(#gemWordGrad)">Gemini 4 Neon</text>
  </g>
</svg>
